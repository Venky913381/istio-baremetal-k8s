apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: IMAGE_BACKEND
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: webappdb
        - name: DB_USER
          value: webapp
        - name: DB_PASSWORD
          value: webapppass
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: web-app
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
