<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Web App Frontend</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; }
      input { padding: 8px; }
      button { padding: 8px 12px; }
      ul { padding-left: 20px; }
    </style>
  </head>
  <body>
    <h1>Web App Frontend</h1>
    <p>This simple frontend calls the backend API at <code>/api/items</code>.</p>

    <div>
      <input id="name" placeholder="item name" />
      <button id="add">Add Item</button>
    </div>

    <h2>Items</h2>
    <ul id="items"></ul>

    <script>
      const itemsEl = document.getElementById('items');
      const nameEl = document.getElementById('name');
      const addBtn = document.getElementById('add');

      async function load() {
        itemsEl.innerHTML = 'Loading...';
        try {
          const res = await fetch('/api/items');
          const data = await res.json();
          itemsEl.innerHTML = '';
          data.forEach(i => {
            const li = document.createElement('li');
            li.textContent = `${i.id}: ${i.name}`;
            itemsEl.appendChild(li);
          });
        } catch (e) {
          itemsEl.innerHTML = 'Error loading items';
        }
      }

      addBtn.addEventListener('click', async () => {
        const name = nameEl.value.trim();
        if (!name) return;
        await fetch('/api/items', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name}) });
        nameEl.value = '';
        load();
      });

      load();
    </script>
  </body>
</html>
