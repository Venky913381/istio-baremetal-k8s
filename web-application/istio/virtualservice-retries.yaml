apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: web-app-retries
  namespace: web-app
spec:
  hosts:
  - "*"
  gateways:
  - web-app-gateway
  http:
  - match:
    - uri:
        prefix: /
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,refused-stream
    timeout: 10s
    route:
    - destination:
        host: web-app.web-app.svc.cluster.local
        port:
          number: 80
