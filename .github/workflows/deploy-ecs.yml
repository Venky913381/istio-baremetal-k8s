name: Deploy ECS Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
        default: 'dev'

      resource:
        description: 'Resource Stack'
        required: true
        type: choice
        options:
          - all
          - vpc
          - iam
          - security-groups
          - ecr
          - ecs
        default: 'all'

      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - init
          - validate
          - plan
          - apply
          - destroy
        default: 'plan'

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: ">= 1.6.0"
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || 'istio-baremetal-k8s-tfstate' }}
  TF_STATE_DYNAMODB: ${{ secrets.TF_STATE_DYNAMODB || '' }}

jobs:
  init:
    name: Init ECS Infrastructure Backend
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'init'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || env.AWS_REGION }}

      - name: Run Terraform Init
        run: |
          ENV="${{ github.event.inputs.environment }}"
          RES="${{ github.event.inputs.resource }}"
          
          if [ "$RES" = "all" ]; then
            RESOURCES=("vpc" "iam" "security-groups" "ecr" "ecs")
          else
            RESOURCES=("$RES")
          fi

          for r in "${RESOURCES[@]}"; do
            TARGET_DIR="./environments/$ENV/$r"
            if [ -d "$TARGET_DIR" ]; then
              echo "===================================================="
              echo "Initializing Backend: $TARGET_DIR"
              echo "===================================================="
              cd "$TARGET_DIR"
              INIT_ARGS=(
                -backend-config="bucket=${TF_STATE_BUCKET}"
                -backend-config="key=environments/${ENV}/${r}/terraform.tfstate"
                -backend-config="region=${AWS_REGION}"
              )
              if [ -n "$TF_STATE_DYNAMODB" ]; then
                INIT_ARGS+=(-backend-config="dynamodb_table=${TF_STATE_DYNAMODB}")
              fi
              terraform init "${INIT_ARGS[@]}"
              cd - > /dev/null
            else
              echo "Directory $TARGET_DIR does not exist. Skipping..."
            fi
          done

  validate:
    name: Validate ECS Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'validate'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Run Terraform Validate
        run: |
          ENV="${{ github.event.inputs.environment }}"
          RES="${{ github.event.inputs.resource }}"
          
          if [ "$RES" = "all" ]; then
            RESOURCES=("vpc" "iam" "security-groups" "ecr" "ecs")
          else
            RESOURCES=("$RES")
          fi

          for r in "${RESOURCES[@]}"; do
            TARGET_DIR="./environments/$ENV/$r"
            if [ -d "$TARGET_DIR" ]; then
              echo "===================================================="
              echo "Validating: $TARGET_DIR"
              echo "===================================================="
              cd "$TARGET_DIR"
              terraform init -backend=false
              terraform fmt -check || echo "Warning: Code formatting issues in $r"
              terraform validate
              cd - > /dev/null
            else
              echo "Directory $TARGET_DIR does not exist. Skipping..."
            fi
          done

  plan:
    name: Plan ECS Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'plan'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || env.AWS_REGION }}

      - name: Run Terraform Plan
        run: |
          ENV="${{ github.event.inputs.environment }}"
          RES="${{ github.event.inputs.resource }}"
          
          if [ "$RES" = "all" ]; then
            RESOURCES=("vpc" "iam" "security-groups" "ecr" "ecs")
          else
            RESOURCES=("$RES")
          fi

          for r in "${RESOURCES[@]}"; do
            TARGET_DIR="./environments/$ENV/$r"
            if [ -d "$TARGET_DIR" ]; then
              echo "===================================================="
              echo "Planning: $TARGET_DIR"
              echo "===================================================="
              cd "$TARGET_DIR"
              INIT_ARGS=(
                -backend-config="bucket=${TF_STATE_BUCKET}"
                -backend-config="key=environments/${ENV}/${r}/terraform.tfstate"
                -backend-config="region=${AWS_REGION}"
              )
              if [ -n "$TF_STATE_DYNAMODB" ]; then
                INIT_ARGS+=(-backend-config="dynamodb_table=${TF_STATE_DYNAMODB}")
              fi
              terraform init "${INIT_ARGS[@]}"
              terraform plan -var-file="terraform.tfvars"
              cd - > /dev/null
            else
              echo "Directory $TARGET_DIR does not exist. Skipping..."
            fi
          done

  apply:
    name: Apply ECS Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'apply'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || env.AWS_REGION }}

      - name: Run Terraform Apply
        run: |
          ENV="${{ github.event.inputs.environment }}"
          RES="${{ github.event.inputs.resource }}"
          
          if [ "$RES" = "all" ]; then
            RESOURCES=("vpc" "iam" "security-groups" "ecr" "ecs")
          else
            RESOURCES=("$RES")
          fi

          for r in "${RESOURCES[@]}"; do
            TARGET_DIR="./environments/$ENV/$r"
            if [ -d "$TARGET_DIR" ]; then
              echo "===================================================="
              echo "Applying: $TARGET_DIR"
              echo "===================================================="
              cd "$TARGET_DIR"
              INIT_ARGS=(
                -backend-config="bucket=${TF_STATE_BUCKET}"
                -backend-config="key=environments/${ENV}/${r}/terraform.tfstate"
                -backend-config="region=${AWS_REGION}"
              )
              if [ -n "$TF_STATE_DYNAMODB" ]; then
                INIT_ARGS+=(-backend-config="dynamodb_table=${TF_STATE_DYNAMODB}")
              fi
              terraform init "${INIT_ARGS[@]}"
              terraform apply -var-file="terraform.tfvars" -auto-approve
              cd - > /dev/null
            else
              echo "Directory $TARGET_DIR does not exist. Skipping..."
            fi
          done

  destroy:
    name: Destroy ECS Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || env.AWS_REGION }}

      - name: Run Terraform Destroy
        run: |
          ENV="${{ github.event.inputs.environment }}"
          RES="${{ github.event.inputs.resource }}"
          
          if [ "$RES" = "all" ]; then
            # Reverse order for safe destruction of dependencies
            RESOURCES=("ecs" "ecr" "security-groups" "iam" "vpc")
          else
            RESOURCES=("$RES")
          fi

          for r in "${RESOURCES[@]}"; do
            TARGET_DIR="./environments/$ENV/$r"
            if [ -d "$TARGET_DIR" ]; then
              echo "===================================================="
              echo "Destroying: $TARGET_DIR"
              echo "===================================================="
              cd "$TARGET_DIR"
              INIT_ARGS=(
                -backend-config="bucket=${TF_STATE_BUCKET}"
                -backend-config="key=environments/${ENV}/${r}/terraform.tfstate"
                -backend-config="region=${AWS_REGION}"
              )
              if [ -n "$TF_STATE_DYNAMODB" ]; then
                INIT_ARGS+=(-backend-config="dynamodb_table=${TF_STATE_DYNAMODB}")
              fi
              terraform init "${INIT_ARGS[@]}"
              terraform destroy -var-file="terraform.tfvars" -auto-approve
              cd - > /dev/null
            else
              echo "Directory $TARGET_DIR does not exist. Skipping..."
            fi
          done
