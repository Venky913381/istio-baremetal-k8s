apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - frontend.yaml
  - backend.yaml
  - inventory.yaml
  - clients.yaml

# The pipeline rewrites these with `kustomize edit set image` to point at ECR.
# For a local cluster, build the images with these names and leave as-is.
images:
  - name: frontend
    newName: frontend
    newTag: latest
  - name: backend
    newName: backend
    newTag: latest
  - name: inventory
    newName: inventory
    newTag: latest
