# One Service "backend" in front of two Deployments (v1, v2).
# Istio DestinationRule subsets pick between them using the "version" label.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: istio-poc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: istio-poc
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: istio-poc
  labels:
    app: backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: v1
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: <ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/istio-k8s-<ENV>/backend:v1 # fill in the <...> placeholders (README step 5)
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VERSION
              value: v1
            - name: INVENTORY_URL
              value: http://inventory:8080
            - name: FAIL_PERCENT
              value: "50"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 160Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: istio-poc
  labels:
    app: backend
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: v2
  template:
    metadata:
      labels:
        app: backend
        version: v2
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: <ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/istio-k8s-<ENV>/backend:v1 # fill in the <...> placeholders (README step 5)
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VERSION
              value: v2
            - name: INVENTORY_URL
              value: http://inventory:8080
            - name: FAIL_PERCENT
              value: "50"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 160Mi
