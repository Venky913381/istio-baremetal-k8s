apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: istio-poc
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: istio-poc
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http # the "http" name tells Istio the protocol
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: istio-poc
  labels:
    app: frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: v1
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      serviceAccountName: frontend
      containers:
        - name: frontend
          image: <ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/istio-k8s-<ENV>/frontend:v1 # fill in the <...> placeholders (README step 5)
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://backend:8080
            - name: EGRESS_URL
              value: https://httpbin.org/get
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 160Mi
