apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      serviceAccountName: inventory
      containers:
        - name: inventory
          image: <ECR_INVENTORY_REPO>:latest
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: app
spec:
  selector:
    app: inventory
  ports:
    - port: 8001
      targetPort: 8001
