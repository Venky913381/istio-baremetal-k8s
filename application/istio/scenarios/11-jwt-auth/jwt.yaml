# /api/* on frontend requires a valid JWT. The web page "/" stays public.
# Uses Istio's sample issuer and keys; get a valid token with:
#   TOKEN=$(curl -s https://raw.githubusercontent.com/istio/istio/release-1.31/security/tools/jwt/samples/demo.jwt)
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: frontend-jwt
  namespace: istio-poc
  labels:
    poc-scenario: jwt-auth
spec:
  selector:
    matchLabels:
      app: frontend
  jwtRules:
    - issuer: testing@secure.istio.io
      jwksUri: https://raw.githubusercontent.com/istio/istio/release-1.31/security/tools/jwt/samples/jwks.json
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: frontend-require-jwt
  namespace: istio-poc
  labels:
    poc-scenario: jwt-auth
spec:
  selector:
    matchLabels:
      app: frontend
  action: ALLOW
  rules:
    - to:
        - operation:
            paths: ["/", "/healthz"]
    - from:
        - source:
            requestPrincipals: ["*"] # any valid token
      to:
        - operation:
            paths: ["/api/*"]
