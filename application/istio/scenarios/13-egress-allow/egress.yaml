# Same lock-down as 12-egress-block, plus a ServiceEntry that allow-lists httpbin.org.
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  namespace: istio-poc
  labels:
    poc-scenario: egress-allow
spec:
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: httpbin-org
  namespace: istio-poc
  labels:
    poc-scenario: egress-allow
spec:
  hosts:
    - httpbin.org
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 443
      name: tls
      protocol: TLS
