# Public entry point: AWS LB -> istio-ingressgateway -> frontend
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: poc-gateway
  namespace: istio-poc
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend
  namespace: istio-poc
spec:
  hosts:
    - "*"
  gateways:
    - poc-gateway
  http:
    - route:
        - destination:
            host: frontend
            port:
              number: 8080
